name: Compilar APK Pygame

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Compilar APK de depuração
        run: buildozer -v android debug

      - name: Publicar APK para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaves-pygame-apk
          path: bin/*.apk
          if-no-files-found: warn
